[project]
name = "telenot-hacs"
version = "0.1.0"
description = "TELENOT complex 400 GMS integration for Home Assistant"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
